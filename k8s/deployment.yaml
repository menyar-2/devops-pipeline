apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-pipeline

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devops-pipeline

  template:
    metadata:
      labels:
        app: devops-pipeline

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - name: devops-pipeline
          image: m221jft4043/devops-pipeline:1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8085

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

      volumes:
        - name: tmp
          emptyDir: {}
