services:

  app:
    image: m221jft4043/devops-pipeline:1.0
    container_name: devops-pipeline-app
    ports:
      - "8085:8085"
    depends_on:
      - mysql
    restart: unless-stopped
    
    secrets:
      - app_secret
  mysql:
    image: mysql:8.0
    container_name: devops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: devopsdb
      MYSQL_USER: devops
      MYSQL_PASSWORD: devops123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:


secrets:
  app_secret:
    file: ./secrets/app_secret.txt
